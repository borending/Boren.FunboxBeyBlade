<title>連結歸類工具</title>
<style>
/* layout: two-column workbench (paste left, grouped result right), stacks to one column under 760px */
:root{
  --bg:#f6f4f0;
  --panel:#ffffff;
  --fg:#23241f;
  --muted:#6b6b63;
  --border:#ddd9d0;
  --accent:#1c6e63;
  --accent-fg:#ffffff;
  --warn:#9a6b00;
  --warn-bg:#fbf1dc;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171815;
    --panel:#1f211d;
    --fg:#eceae2;
    --muted:#9a988d;
    --border:#34362f;
    --accent:#4fb3a3;
    --accent-fg:#0d1512;
    --warn:#e3b34a;
    --warn-bg:#2c2608;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171815;
  --panel:#1f211d;
  --fg:#eceae2;
  --muted:#9a988d;
  --border:#34362f;
  --accent:#4fb3a3;
  --accent-fg:#0d1512;
  --warn:#e3b34a;
  --warn-bg:#2c2608;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:"Segoe UI","PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,-apple-system,sans-serif;
  padding-inline:20px;
  padding-block:28px;
}
.wrap{max-width:1040px;margin:0 auto}

header.page{margin-bottom:20px}
h1{
  font-size:clamp(1.3rem,1rem + 1vw,1.7rem);
  margin:0 0 6px;
  letter-spacing:-0.01em;
  text-wrap:balance;
}
header.page p{margin:0;color:var(--muted);font-size:0.92rem}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
  align-items:start;
}
@media (max-width:760px){
  .grid{grid-template-columns:1fr}
}

.panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:10px;
  padding:16px;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.panel h2{
  font-size:0.78rem;
  font-weight:600;
  margin:0;
  color:var(--muted);
  letter-spacing:0.04em;
  text-transform:uppercase;
}

textarea{
  width:100%;
  min-height:360px;
  resize:vertical;
  background:transparent;
  color:var(--fg);
  border:1px solid var(--border);
  border-radius:8px;
  padding:10px 12px;
  font:13px/1.55 "Cascadia Code","SFMono-Regular",Consolas,monospace;
  white-space:pre;
}
textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

button{
  font:inherit;
  font-size:0.85rem;
  font-weight:600;
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--fg);
  border-radius:7px;
  padding:8px 14px;
  cursor:pointer;
}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{
  background:var(--accent);
  color:var(--accent-fg);
  border-color:var(--accent);
}
button.primary:hover{filter:brightness(1.06)}

.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:0.82rem;color:var(--muted)}
.stats b{color:var(--fg);font-variant-numeric:tabular-nums}

.notice{
  display:none;
  font-size:0.8rem;
  background:var(--warn-bg);
  color:var(--warn);
  border:1px solid var(--warn);
  border-radius:7px;
  padding:8px 10px;
  line-height:1.5;
}
.notice.show{display:block}

footer.hint{margin-top:18px;color:var(--muted);font-size:0.78rem;line-height:1.6}
</style>

<div class="wrap">
  <header class="page">
    <h1>連結歸類工具</h1>
    <p>貼上多批「品項名稱＋連結」文字，依商品編號自動合併成同一品項、整理成可直接複製的清單。</p>
  </header>

  <div class="grid">
    <section class="panel">
      <h2>貼上原始文字</h2>
      <textarea id="input" spellcheck="false"></textarea>
      <div class="row">
        <button class="primary" id="runBtn">整理連結</button>
        <button id="clearBtn">清空</button>
      </div>
    </section>

    <section class="panel">
      <h2>整理結果</h2>
      <textarea id="output" readonly spellcheck="false"></textarea>
      <div class="row">
        <button class="primary" id="copyBtn">複製結果</button>
        <span class="stats" id="stats"></span>
      </div>
      <div class="notice" id="notice"></div>
    </section>
  </div>

  <footer class="hint">
    判斷規則：每個商品編號（例如 UX-03、BXG-04）視為同一品項，自動合併所有出現過的連結；名稱以該編號下最完整的一次用字顯示。無法辨識編號的行（例如「其他 超人力霸王聯名款」）會整行當作品項名稱。
  </footer>
</div>

<script>
(function(){
  const CODE_RE = /^([A-Za-z]{1,4}-\d+)\s*/;
  const URL_RE = /https?:\/\/\S+/;
  const NUM_PREFIX_RE = /^\(?\d{1,3}[.\)]?\s*/;
  const QUOTE_RE = /^["'“”‘’`]+|["'“”‘’`]+$/g;

  function cleanName(raw){
    let s = raw.replace(QUOTE_RE, '').trim();
    s = s.replace(NUM_PREFIX_RE, '');
    s = s.replace(/\s+/g, ' ').trim();
    return s;
  }

  function parse(text){
    const lines = text.split(/\r?\n/);
    const entries = [];
    const ignored = [];
    let pendingName = '';

    for (const rawLine of lines){
      const trimmed = rawLine.trim();
      if (!trimmed) continue;

      const m = trimmed.match(URL_RE);
      if (m){
        const before = trimmed.slice(0, m.index).trim();
        let name = pendingName;
        if (before) name = before;
        name = cleanName(name);
        pendingName = '';
        if (!name) name = '(未命名品項)';
        entries.push({ name, url: m[0] });
      } else {
        if (pendingName) ignored.push(pendingName);
        pendingName = trimmed;
      }
    }
    if (pendingName) ignored.push(pendingName);

    const groups = new Map();
    for (const e of entries){
      const codeMatch = e.name.match(CODE_RE);
      let key, rest, code;
      if (codeMatch){
        code = codeMatch[1].toUpperCase();
        rest = e.name.slice(codeMatch[0].length).trim();
        key = code;
      } else {
        code = null;
        rest = e.name;
        key = e.name;
      }
      if (!groups.has(key)){
        groups.set(key, { code, rests: [], urls: [] });
      }
      const g = groups.get(key);
      if (rest && !g.rests.includes(rest)) g.rests.push(rest);
      if (!g.urls.includes(e.url)) g.urls.push(e.url);
    }

    const collator = new Intl.Collator('en', { numeric: true, sensitivity: 'base' });
    const result = [...groups.entries()].map(([key, g]) => {
      const bestRest = g.rests.slice().sort((a,b) => b.length - a.length)[0] || '';
      const displayName = g.code ? (bestRest ? `${g.code} ${bestRest}` : g.code) : (bestRest || key);
      return { key, code: g.code, displayName, urls: g.urls };
    }).sort((a,b) => {
      if (a.code && b.code) return collator.compare(a.code, b.code);
      if (a.code && !b.code) return -1;
      if (!a.code && b.code) return 1;
      return collator.compare(a.displayName, b.displayName);
    });

    return { result, entryCount: entries.length, ignored };
  }

  function render(){
    const text = document.getElementById('input').value;
    const { result, entryCount, ignored } = parse(text);

    const blocks = ['品項名稱\nurl'];
    for (const g of result){
      blocks.push(`${g.displayName}\n${g.urls[0]}`);
      for (let i = 1; i < g.urls.length; i++) blocks.push(g.urls[i]);
    }
    document.getElementById('output').value = blocks.join('\n\n');

    document.getElementById('stats').innerHTML =
      `<span><b>${result.length}</b> 個品項</span><span><b>${entryCount}</b> 個連結</span>`;

    const notice = document.getElementById('notice');
    if (ignored.length){
      notice.textContent = '未配對到連結、已忽略的文字：' + ignored.join('、');
      notice.classList.add('show');
    } else {
      notice.classList.remove('show');
      notice.textContent = '';
    }
  }

  document.getElementById('runBtn').addEventListener('click', render);
  document.getElementById('clearBtn').addEventListener('click', () => {
    document.getElementById('input').value = '';
    document.getElementById('output').value = '';
    document.getElementById('stats').innerHTML = '';
    document.getElementById('notice').classList.remove('show');
  });
  document.getElementById('copyBtn').addEventListener('click', async () => {
    const out = document.getElementById('output');
    const btn = document.getElementById('copyBtn');
    try{
      await navigator.clipboard.writeText(out.value);
    }catch(e){
      out.focus();
      out.select();
    }
    const old = btn.textContent;
    btn.textContent = '已複製';
    setTimeout(() => { btn.textContent = old; }, 1200);
  });

  const sample =
`UX-03 魔導神杖
https://lin.ee/PGDpUEa
BX-00 暴風天馬3-70RA
https://lin.ee/oXO4TcJ
BXG-04 銀牙烈虎S
https://lin.ee/yM7y5pM

CX-00 迪卡狂怒 FT3-60T
https://lin.ee/y3WBe5c
UX-03 魔導神杖
https://lin.ee/vMU5AVa
BXG-04 銀牙烈虎
https://lin.ee/YZ8gFdo

1.CX-00 迪卡狂怒 FT3-60T –
https://lin.ee/Qg4j9AE
2.UX-03 魔導神杖 -
https://lin.ee/uPhLbsA
3.BX-37 雙重極限衝擊戰鬥盤 豪華組 -
https://lin.ee/6XOm67X`;

  document.getElementById('input').value = sample;
  render();
})();
</script>
